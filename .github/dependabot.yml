version: 2
updates:
  # Keeps the SHA-pinned actions in build-image.yml up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Proposes new jlesage/firefox tag+digest pins for the inline FROM line in
  # Dockerfile.hanging (Firefox security updates).  Dependabot cannot update
  # images referenced through ARG or ${VAR} substitutions.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Updates fixed image tags in compose.yaml and compose.ghcr.yaml (autoheal, alpine).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
