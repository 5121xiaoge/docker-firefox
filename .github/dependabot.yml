version: 2
updates:
  # Keeps the SHA-pinned actions in build-image.yml up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Proposes new pinned jlesage/firefox base images (Firefox security updates).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
